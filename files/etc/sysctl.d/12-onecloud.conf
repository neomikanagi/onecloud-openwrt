# Tuning for OneCloud: 4x Cortex-A5, 1 GB RAM, 100 Mbit NIC, zram swap.

# BBR. Most of the TCP traffic this box originates is proxy traffic, which
# is exactly where BBR helps. Pacing is done inside BBR since Linux 4.13,
# so the fq qdisc is not needed and fq_codel stays the default (it also
# does AQM, which fq does not).
net.ipv4.tcp_congestion_control=bbr

net.ipv4.tcp_fastopen=3
net.ipv4.tcp_mtu_probing=1
net.ipv4.tcp_slow_start_after_idle=0
net.ipv4.tcp_fin_timeout=30
net.ipv4.tcp_keepalive_time=600

# 2 MB socket buffer ceiling: enough for a 100 Mbit link with a long RTT
# through a proxy, small enough not to matter on 1 GB of RAM.
net.core.rmem_max=2097152
net.core.wmem_max=2097152
net.ipv4.tcp_rmem=4096 87380 2097152
net.ipv4.tcp_wmem=4096 65536 2097152
net.core.netdev_max_backlog=2048
net.core.somaxconn=2048

# Conntrack: the default derived from RAM is tight once a proxy is holding
# a few thousand flows. 32k entries costs about 10 MB.
net.netfilter.nf_conntrack_max=32768
net.netfilter.nf_conntrack_tcp_timeout_established=3600

# Swap is zram, i.e. RAM. Swapping early is cheaper than reclaiming cache.
vm.swappiness=100
vm.vfs_cache_pressure=50
